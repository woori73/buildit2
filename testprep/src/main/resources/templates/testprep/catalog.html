<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/base :: head(${kind == 'PRACTICE'} ? 'iBT Practice' : 'Vocabulary Quiz')}"></head>
<body>
<nav th:replace="~{fragments/base :: nav(${pageActive})}"></nav>
<div class="wrap section">
  <h2 th:text="${kind == 'PRACTICE'} ? 'TOEFL iBT Practice Tests' : 'Vocabulary Quiz'">Catalog</h2>
  <p class="lead" th:text="${kind == 'PRACTICE'}
      ? 'Take a real timed set modeled on the 2026 structure. Auto-scored items return an internal band estimate.'
      : 'Learn TOEFL academic words: English→meaning, meaning→English, and context blanks. Wrong words can be retried.'">Catalog</p>
  <div id="catalog"><p class="lead">Loading…</p></div>
  <div class="disclaimer" style="margin-top:22px">Scores in TestPrep are internal estimates, not official ETS scores.</div>
</div>
<script th:inline="javascript">
  window.TP_KIND = /*[[${kind}]]*/ 'PRACTICE';
</script>
<script defer src="/js/testprep_catalog.js"></script>
<div th:replace="~{fragments/base :: footer}"></div>
</body>
</html>
