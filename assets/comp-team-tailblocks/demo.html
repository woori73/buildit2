<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>comp-team-tailblocks — 강사진 카드 그리드 데모 (가상 샘플)</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 데모 페이지 기본 리셋 (컴포넌트 코드 아님) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
  </style>
</head>
<body>

  <!-- ⚠ 아래 이름·경력·수치는 모두 가상의 예시(SAMPLE)입니다. 실제 서비스에서는 회원이 입력한 값만 사용하세요. -->
  <section class="bi-team" data-bi-sample="true" aria-label="강사진 소개">
    <div class="bi-team__inner">

      <div class="bi-team__header">
        <p class="bi-team__eyebrow">INSTRUCTORS</p>
        <h2 class="bi-team__title">강사진 (샘플)</h2>
        <p class="bi-team__desc">이 문구와 아래 강사 정보는 샘플입니다.</p>
      </div>

      <ul class="bi-team__grid">
        <li class="bi-team__card">
          <div class="bi-team__photo" role="img" aria-label="강사 사진 플레이스홀더">샘</div>
          <h3 class="bi-team__name">[강사 이름 1]</h3>
          <span class="bi-team__subject">[역할/과목]</span>
          <p class="bi-team__career">[경력 한 줄]<br>[경력 한 줄]</p>
        </li>
        <li class="bi-team__card">
          <div class="bi-team__photo" role="img" aria-label="강사 사진 플레이스홀더">샘</div>
          <h3 class="bi-team__name">[강사 이름 2]</h3>
          <span class="bi-team__subject">[역할/과목]</span>
          <p class="bi-team__career">[경력 한 줄]<br>[경력 한 줄]</p>
        </li>
        <li class="bi-team__card">
          <div class="bi-team__photo" role="img" aria-label="[강사 이름 3] 사진 플레이스홀더">이</div>
          <h3 class="bi-team__name">[강사 이름 3]</h3>
          <span class="bi-team__subject">[역할/과목]</span>
          <p class="bi-team__career">[경력 한 줄]<br>[경력 한 줄]</p>
        </li>
        <li class="bi-team__card">
          <div class="bi-team__photo" role="img" aria-label="[강사 이름 4] 사진 플레이스홀더">최</div>
          <h3 class="bi-team__name">[강사 이름 4]</h3>
          <span class="bi-team__subject">[역할/과목]</span>
          <p class="bi-team__career">[경력 한 줄]<br>[경력 한 줄]</p>
        </li>
      </ul>

    </div>
  </section>

</body>
</html>
