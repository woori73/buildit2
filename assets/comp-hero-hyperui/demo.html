<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>comp-hero-hyperui — 2열 히어로 섹션 데모</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* 데모 페이지 기본 리셋 (컴포넌트 코드 아님) */
    * { margin: 0; padding: 0; box-sizing: border-box; }
  </style>
</head>
<body>

  <section class="bi-hero" aria-label="한빛학원 소개">
    <div class="bi-hero__inner">

      <div class="bi-hero__content">
        <p class="bi-hero__badge">2026학년도 신입생 모집 중</p>
        <h1 class="bi-hero__title">
          내신 1등급의 시작,<br>
          <span class="bi-hero__accent">한빛학원</span>에서 만드세요
        </h1>
        <p class="bi-hero__desc">
          15년 경력의 전문 강사진이 1:1 맞춤 학습 설계로
          학생 한 명 한 명의 성적을 끝까지 책임집니다.
          첫 상담은 무료이며, 수준별 반 편성 테스트를 제공합니다.
        </p>
        <div class="bi-hero__actions">
          <a href="#consult" class="bi-hero__btn bi-hero__btn--primary">무료 상담 신청</a>
          <a href="#curriculum" class="bi-hero__btn bi-hero__btn--secondary">커리큘럼 보기</a>
        </div>
        <p class="bi-hero__note">※ 상담 신청 시 학습 진단 리포트를 무료로 제공합니다.</p>
      </div>

      <div class="bi-hero__visual" role="img" aria-label="한빛학원 수업 이미지 플레이스홀더">
        <div class="bi-hero__visual-caption">
          <p class="bi-hero__visual-title">2025학년도 대입 실적</p>
          <p class="bi-hero__visual-text">서울대 12명 · 연세대 28명 · 고려대 31명 합격</p>
        </div>
      </div>

    </div>
  </section>

</body>
</html>
